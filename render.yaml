services:
  - type: worker
    name: beyblade-qotd-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: QOTD_POST_TIME
        value: 09:00
      - key: QOTD_TIMEZONE
        value: Europe/London
